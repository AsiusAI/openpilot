name: Dragon v1 device

on:
  push:
    branches:
      - v1
  workflow_dispatch:

concurrency:
  group: dragon-v1-device
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "1"
  UNSAFE: "1"
  OPENPILOT_ROOT: ${{ github.workspace }}
  PYTHONPATH: ${{ github.workspace }}
  LD_LIBRARY_PATH: /opt/qcom-adreno/lib
  COMMA_CACHE: /data/github-runner/cache

jobs:
  hardware:
    name: Dragon health and A/B
    runs-on: [self-hosted, Linux, ARM64, asius-dragon-v1]
    timeout-minutes: 60
    steps:
      - name: Check out Openpilot
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          lfs: false
          submodules: recursive
          clean: false

      - name: Check out Vamos health tools
        uses: actions/checkout@v7
        with:
          repository: asiusai/vamos
          ref: one
          path: vamos-ci
          clean: false

      - name: Stop installed Openpilot
        run: sudo sv down openpilot

      - name: Verify model assets and build
        timeout-minutes: 30
        run: |
          source launch_env.sh
          git lfs pull
          git lfs fsck
          python3 openpilot/system/manager/build.py

      - name: Manager device tests
        run: |
          source launch_env.sh
          python3 openpilot/system/manager/test/test_manager.py

      - name: OS04C10 camera tests
        timeout-minutes: 5
        run: |
          source launch_env.sh
          python3 openpilot/system/camerad/test/test_camerad.py

      - name: Hardware encoder tests
        timeout-minutes: 5
        run: |
          source launch_env.sh
          python3 openpilot/system/loggerd/tests/test_encoder.py

      - name: Dragon model replay
        timeout-minutes: 10
        env:
          DISABLE_DMON: "1"
        run: |
          source launch_env.sh
          taskset -c 6-7 python3 openpilot/selfdrive/test/process_replay/model_replay.py

      - name: Full Dragon health check
        timeout-minutes: 10
        env:
          DRAGON_HEALTH_MIN_CAMERAS: "3"
        run: |
          source launch_env.sh
          python3 -u vamos-ci/dragon_health.py

      - name: A/B storage and boot-control check
        run: sudo env PYTHONPATH=/usr/lib python3 -u vamos-ci/tools/update/check_device_ab.py --write-check

      - name: Upload health artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dragon-v1-health-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/dragon_health
            /tmp/dragon_health_manager.log
            model_diff.txt

      - name: Restore installed Openpilot
        if: always()
        run: sudo sv up openpilot
