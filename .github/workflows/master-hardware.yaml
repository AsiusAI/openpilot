name: Master hardware

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: master-hardware
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "1"
  UNSAFE: "1"
  COMMA_CACHE: /data/github-runner/cache
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx

jobs:
  comma_3x:
    name: comma 3X health
    runs-on: [self-hosted, Linux, ARM64, asius-comma-3x]
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PATH: /usr/local/venv/bin:/usr/local/bin:/usr/bin:/bin
      LD_LIBRARY_PATH: /usr/local/lib
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          lfs: false
          submodules: recursive
          clean: false

      - name: Stop installed openpilot
        run: sudo systemctl stop comma.service

      - name: Verify model assets and build
        timeout-minutes: 30
        run: |
          mkdir -p "$COMMA_CACHE" /data/model_replay_cache
          ln -sfn msgq_repo/msgq msgq
          ln -sfn opendbc_repo/opendbc opendbc
          ln -sfn rednose_repo/rednose rednose
          ln -sfn teleoprtc_repo/teleoprtc teleoprtc
          ln -sfn tinygrad_repo/tinygrad tinygrad
          git lfs pull
          git lfs fsck --pointers
          python openpilot/system/manager/build.py

      - name: Manager device tests
        run: python openpilot/system/manager/test/test_manager.py

      - name: Camera tests
        timeout-minutes: 5
        run: python openpilot/system/camerad/test/test_camerad.py

      - name: Hardware encoder tests
        timeout-minutes: 5
        run: python openpilot/system/loggerd/tests/test_encoder.py

      - name: Model runtime and timing
        timeout-minutes: 10
        run: |
          sudo systemd-run --wait --pipe --collect --uid=comma \
            -p WorkingDirectory="$GITHUB_WORKSPACE" \
            -p LimitRTPRIO=100 -p LimitNICE=-10 \
            --setenv=PATH="$PATH" \
            --setenv=PYTHONPATH="$PYTHONPATH" \
            --setenv=COMMA_CACHE="$COMMA_CACHE" \
            taskset -c 6-7 python -u openpilot/selfdrive/test/process_replay/model_replay.py --timing-only

      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: comma-3x-health-${{ github.run_id }}
          if-no-files-found: ignore
          path: model_diff.txt

      - name: Restore installed openpilot
        if: always()
        run: sudo systemctl start comma.service

  asius_v1:
    name: Asius v1 health
    runs-on: [self-hosted, Linux, ARM64, asius-dragon-v1]
    timeout-minutes: 60
    env:
      OPENPILOT_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}
      LD_LIBRARY_PATH: /opt/qcom-adreno/lib
    steps:
      - name: Check out v1
        uses: actions/checkout@v7
        with:
          ref: v1
          fetch-depth: 0
          lfs: false
          submodules: recursive
          clean: false

      - name: Merge the master revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_SHA"
          git merge --no-edit "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: Check out Vamos health tools
        uses: actions/checkout@v7
        with:
          repository: asiusai/vamos
          ref: one
          path: vamos-ci
          clean: false

      - name: Stop installed openpilot
        run: sudo sv down openpilot

      - name: Verify model assets and build
        timeout-minutes: 30
        run: |
          source launch_env.sh
          git lfs pull
          git lfs fsck --pointers
          python3 openpilot/system/manager/build.py

      - name: Manager device tests
        run: |
          source launch_env.sh
          python3 openpilot/system/manager/test/test_manager.py

      - name: OS04C10 camera tests
        timeout-minutes: 5
        run: |
          source launch_env.sh
          python3 openpilot/system/camerad/test/test_camerad.py

      - name: Hardware encoder tests
        timeout-minutes: 5
        run: |
          source launch_env.sh
          python3 openpilot/system/loggerd/tests/test_encoder.py

      - name: Dragon model runtime and timing
        timeout-minutes: 10
        run: |
          source launch_env.sh
          taskset -c 6-7 python3 openpilot/selfdrive/test/process_replay/model_replay.py --timing-only

      - name: Full Dragon health check
        timeout-minutes: 10
        env:
          DRAGON_HEALTH_MIN_CAMERAS: "3"
        run: |
          source launch_env.sh
          python3 -u vamos-ci/dragon_health.py

      - name: Upload health artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: asius-v1-health-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/dragon_health
            /tmp/dragon_health_manager.log
            model_diff.txt

      - name: Restore installed openpilot
        if: always()
        run: sudo sv up openpilot
