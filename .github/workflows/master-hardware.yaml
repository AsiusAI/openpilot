name: Hardware

on:
  push:
    branches:
      - master
      - v1
  workflow_dispatch:

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "1"
  UNSAFE: "1"
  COMMA_CACHE: /data/github-runner/cache
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx

jobs:
  hardware:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Asius v1
            device: asius-v1
            runner: asius-dragon-v1
          - name: comma 3X
            device: comma-3x
            runner: asius-comma-3x
    runs-on: [self-hosted, Linux, ARM64, "${{ matrix.runner }}"]
    timeout-minutes: 60
    env:
      OPENPILOT_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}
      PATH: /usr/local/venv/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /usr/local/lib:/opt/qcom-adreno/lib:/opt/qcom-adreno/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu
    steps:
      - name: Check out v1
        uses: actions/checkout@v7
        with:
          ref: v1
          fetch-depth: 0
          lfs: false
          submodules: recursive
          clean: false

      - name: Merge tested revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_SHA"
          git merge --no-edit "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: Stop installed openpilot
        run: python openpilot/system/hardware/openpilot_service.py stop

      - name: Verify model assets and build
        timeout-minutes: 30
        run: |
          source launch_env.sh
          mkdir -p "$COMMA_CACHE" /data/model_replay_cache
          ln -sfn msgq_repo/msgq msgq
          ln -sfn opendbc_repo/opendbc opendbc
          ln -sfn rednose_repo/rednose rednose
          ln -sfn teleoprtc_repo/teleoprtc teleoprtc
          ln -sfn tinygrad_repo/tinygrad tinygrad
          git lfs pull
          git lfs fsck --pointers
          python openpilot/system/manager/build.py

      - name: Manager device tests
        run: |
          source launch_env.sh
          python openpilot/system/manager/test/test_manager.py

      - name: Camera tests
        timeout-minutes: 5
        run: |
          source launch_env.sh
          python openpilot/system/camerad/test/test_camerad.py

      - name: Hardware encoder tests
        timeout-minutes: 5
        run: |
          source launch_env.sh
          python openpilot/system/loggerd/tests/test_encoder.py

      - name: Model runtime and timing
        timeout-minutes: 10
        run: |
          source launch_env.sh
          taskset -c 6-7 python -u openpilot/selfdrive/test/process_replay/model_replay.py --timing-only

      - name: Bluetooth health
        if: matrix.device == 'asius-v1'
        run: |
          bluetoothctl show | grep -q "Powered: yes"
          python -m unittest openpilot.system.athena.tests.test_ble_protocol openpilot.system.athena.tests.test_ble_pairing openpilot.system.athena.tests.test_bled

      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device }}-health-${{ github.run_id }}
          if-no-files-found: ignore
          path: model_diff.txt

      - name: Restore installed openpilot
        if: always()
        run: python openpilot/system/hardware/openpilot_service.py start
